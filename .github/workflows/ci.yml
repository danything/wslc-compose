name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal --component clippy,rustfmt && rustup default 1.99
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: wslc-compose
          path: target/release/wslc-compose.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wslc-compose
      - shell: pwsh
        run: |
          (Get-FileHash wslc-compose.exe -Algorithm SHA256).Hash.ToLower() + '  wslc-compose.exe' | Set-Content SHA256SUMS -NoNewline
          gh release create $env:GITHUB_REF_NAME wslc-compose.exe SHA256SUMS --repo $env:GITHUB_REPOSITORY --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # GITHUB_TOKEN で作ったリリースは別のワークフローを起動しないので、同じワークフローで winget に PR を出す
  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: danything.wslc-compose
          release-tag: ${{ github.ref_name }}
          installers-regex: '\.exe$'
          fork-user: 5ym
          # public_repo と workflow のスコープを持つクラシック PAT
          token: ${{ secrets.WINGET_TOKEN }}
